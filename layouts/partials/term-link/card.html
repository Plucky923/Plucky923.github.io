<a href="{{ .Page.RelPermalink }}" class="plucky-term-card">
  <article class="plucky-term-card-shell">
    <div>
      <p class="plucky-term-card-label">INDEX ENTRY</p>
      <h2 class="plucky-term-card-title">
        {{ .Page.Title | emojify }}
      </h2>
    </div>

    {{ if site.Params.taxonomy.showTermCount | default true }}
      <span class="plucky-term-card-count">
        {{ .Count }}
      </span>
    {{ end }}
  </article>
</a>
