# -- Theme Options --
# https://blowfish.page/docs/configuration/#theme-parameters

# ============================================================
# Global visual identity
# ============================================================

colorScheme = "plucky"

defaultAppearance = "dark"
autoSwitchAppearance = false
disableTextInHeader = false

enableSearch = true
enableCodeCopy = true
enableStyledScrollbar = true

disableImageZoom = false
disableImageOptimization = false
disableImageOptimizationMD = false

highlightCurrentMenuArea = true

smartTOC = true
smartTOCHideUnfocusedChildren = true

# Wide editorial thumbnails.
thumbnailAspectRatio = "1.75"


# ============================================================
# Header
# ============================================================

[header]
  layout = "fixed-fill-blur"


# ============================================================
# Footer
# ============================================================

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false

  # Keep the dark visual language consistent.
  showAppearanceSwitcher = false

  showScrollToTop = true


# ============================================================
# Homepage
# ============================================================

[homepage]
  # Do not use the built-in hero, card, or background templates.
  layout = "custom"

  showRecent = false
  showRecentItems = 0

  showMoreLink = false
  showMoreLinkDest = "/"

  # Recent posts become a wide editorial gallery.
  cardView = true
  cardViewScreenWidth = true


# ============================================================
# Article pages
# ============================================================

[article]
  showDate = true
  showDateUpdated = true

  showAuthor = false
  showAuthorBottom = false

  showHero = false
  heroStyle = "big"

  showBreadcrumbs = true
  showHeadingAnchors = true

  showPagination = true
  invertPagination = false

  showReadingTime = true
  showWordCount = true
  showTableOfContents = true

  showTaxonomies = true
  showCategories = true
  showTags = true
  showCategoriesInSecondaryColor = true

  showZenMode = true
  showComments = true

  sharingLinks = []


# ============================================================
# List pages
# ============================================================

[list]
  showHero = false
  showBreadcrumbs = true

  showSummary = true
  groupByYear = false

  cardView = true
  cardViewScreenWidth = false


# ============================================================
# Taxonomy pages
# ============================================================

[taxonomy]
  showTermCount = true
  showBreadcrumbs = true
  cardView = true

[term]
  showBreadcrumbs = true
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false
